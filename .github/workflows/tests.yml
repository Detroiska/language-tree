name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.check }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            check: tests
          - os: windows-latest
            check: tests-windows
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: npm ci
      - name: Lint JavaScript
        run: npm run lint:js
      - name: Install Ruff
        run: python -m pip install ruff
      - name: Lint Python
        run: python -m ruff check server.py
      - name: Engine suite
        run: node tests/engine.test.mjs
      - name: Bulk suite
        run: node tests/bulk.test.mjs
      - name: Server suite
        env:
          PYTHON: python
        run: node tests/server.test.mjs
