name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dev dependencies
        run: npm ci
      - name: Lint JavaScript
        run: npm run lint:js
      - name: Lint Python
        run: |
          python -m pip install ruff
          python -m ruff check server.py
      - name: Engine suite
        run: node tests/engine.test.mjs
      - name: Bulk suite
        run: node tests/bulk.test.mjs
      - name: Server suite
        run: node tests/server.test.mjs
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: UI smoke test
        run: npm run test:ui
