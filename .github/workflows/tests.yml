name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Engine suite
        run: node tests/engine.test.mjs
      - name: Bulk suite
        run: node tests/bulk.test.mjs
      - name: Server suite
        run: node tests/server.test.mjs
